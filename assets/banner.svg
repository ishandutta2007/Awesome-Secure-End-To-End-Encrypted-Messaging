<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #9ca3af;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .float-icon {
      animation: float 4s infinite ease-in-out;
    }
    .grid-wave {
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

  <!-- Subtle Dynamic Wave & Network Background Elements -->
  <g opacity="0.25">
    <path d="M-50,200 Q200,100 450,220 T950,150 T1250,240" fill="none" stroke="url(#primaryGlow)" stroke-width="2" stroke-dasharray="8 6" class="grid-wave" />
    <path d="M-50,120 Q300,260 600,140 T1100,220 T1250,100" fill="none" stroke="url(#emeraldGlow)" stroke-width="1.5" stroke-dasharray="12 6" class="grid-wave" />
  </g>

  <!-- Animated Glowing Background Nodes (Kept behind foreground content) -->
  <g filter="url(#glowFilter)" opacity="0.4">
    <circle cx="1050" cy="90" r="70" fill="#8b5cf6" class="pulse-circle" />
    <circle cx="150" cy="240" r="50" fill="#06b6d4" class="pulse-circle" />
  </g>

  <!-- Decorative Right Side Glassmorphism Encrypted Shield/Lock Graphics (Background/Side Element) -->
  <g transform="translate(900, 50)" filter="url(#dropShadow)" class="float-icon">
    <rect x="0" y="0" width="220" height="220" rx="24" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <!-- Lock Shield Visual -->
    <path d="M110 40 L160 65 V120 C160 155 110 180 110 180 C110 180 60 155 60 120 V65 L110 40 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lock Shackle & Body -->
    <rect x="92" y="105" width="36" height="30" rx="6" fill="url(#emeraldGlow)" />
    <path d="M98 105 V96 C98 89 103 84 110 84 C117 84 122 89 122 96 V105" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="110" cy="118" r="3" fill="#0b0f19" />
  </g>

  <!-- Foreground Main Text Content (Positioned clearly on the left so titles are never hidden) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="30" y="21" class="badge-text">🔒 END-TO-END ENCRYPTED ECOSYSTEM</text>
    </g>

    <!-- Title -->
    <text x="0" y="135" class="title-text" filter="url(#dropShadow)">
      Awesome Secure Messaging
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle-text">
      Curated Sovereign Communication Platforms, SaaS, &amp; Open-Source Projects
    </text>

    <!-- Highlights Badges/Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">🛡️ E2E Encrypted</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(147, 0)">
        <rect width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc">⚡ Open Source</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(294, 0)">
        <rect width="155" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="14" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#67e8f9">🌐 Self-Hosted &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>
