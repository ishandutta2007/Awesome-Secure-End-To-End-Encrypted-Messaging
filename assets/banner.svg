th="1.5" rx="16"/><g opacity=".25"><path fill="none" stroke="url(#primaryGlow)" stroke-dasharray="8 6" stroke-width="2" d="M-50,200 Q200,100 450,220 T950,150 T1250,240" class="grid-wave"/><path fill="none" stroke="url(#emeraldGlow)" stroke-dasharray="12 6" stroke-width="1.5" d="M-50,120 Q300,260 600,140 T1100,220 T1250,100" class="grid-wave"/></g><g filter="url(#glowFilter)" opacity=".4"><circle cx="1050" cy="90" r="70" fill="#8b5cf6" class="pulse-circle"/><circle cx="150" cy="240" r="50" fill="#06b6d4" class="pulse-circle"/></g><g class="float-icon" filter="url(#dropShadow)" transform="translate(900, 50)"><rect width="220" height="220" x="0" y="0" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" rx="24"/><path fill="none" stroke="url(#primaryGlow)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M110 40 L160 65 V120 C160 155 110 180 110 180 C110 180 60 155 60 120 V65 L110 40 Z"/><rect width="36" height="30" x="92" y="105" fill="url(#emeraldGlow)" rx="6"/><path fill="none" stroke="#10b981" stroke-linecap="round" stroke-width="3.5" d="M98 105 V96 C98 89 103 84 110 84 C117 84 122 89 122 96 V105"/><circle cx="110" cy="118" r="3" fill="#0b0f19"/></g><g><g transform="translate(70, 0) translate(0, 52)"><rect width="280" height="32" x="0" y="0" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="4" fill="#38bdf8"/><text x="30" y="21" class="badge-text">🔒 END-TO-END ENCRYPTED ECOSYSTEM</text></g><text x="0" y="135" class="title-text" filter="url(#dropShadow)" transform="translate(70, 0)">Awesome Secure Messaging</text><text x="0" y="180" class="subtitle-text" transform="translate(70, 0)">Curated Sovereign Communication Platforms, SaaS, &amp; Open-Source Projects</text><g><g transform="translate(70, 0) translate(0, 215) translate(0, 0)"><rect width="135" height="30" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="8"/><text x="